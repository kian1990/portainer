services:
  db:
    image: mariadb:12
    container_name: nextcloud-db
    restart: always
    ports:
      - 3306:3306
    command: --transaction-isolation=READ-COMMITTED
    volumes:
      - ./db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root

  app:
    image: nextcloud:33
    container_name: nextcloud-app
    restart: always
    ports:
      - 80:80
    volumes:
      - ./nextcloud:/var/www/html
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
    depends_on:
      - db
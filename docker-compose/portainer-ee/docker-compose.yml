services:
  portainer:
    image: portainer/portainer-ee:2.38.0
    container_name: portainer-ee
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-ee:/data
    restart: always
    network_mode: "bridge"

volumes:
  portainer-ee: